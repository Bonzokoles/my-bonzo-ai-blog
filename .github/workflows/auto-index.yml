name: Auto-Index Search Engines
on:
    schedule:
        # Co 30 minut
        - cron: "*/30 * * * *"
    workflow_dispatch: # Możliwość ręcznego uruchomienia

jobs:
    ping-search-engines:
        runs-on: ubuntu-latest
        steps:
            - name: Ping Bing Sitemap
              run: |
                  curl -f "https://www.bing.com/ping?sitemap=https://mybonzoaiblog.pages.dev/sitemap-pumo.xml" || echo "Bing ping failed"

            - name: Ping Google Sitemap
              run: |
                  curl -f "https://www.google.com/ping?sitemap=https://mybonzoaiblog.pages.dev/sitemap-pumo.xml" || echo "Google ping may require verification"

            - name: Trigger IndexNow
              run: |
                  curl -X POST https://mybonzoaiblog.pages.dev/api/index-now \
                    -H "Content-Type: application/json" \
                    -d '{"urls":["/pumo-guide/","/pumo-guide/agent","/pumo-guide/Biurka_Biurka_gamingowe","/pumo-guide/Fotele_Fotele_do_biurka","/pumo-guide/Sofy_i_narożniki_Sofy_3_osobowe"]}' || echo "IndexNow failed"

            - name: Ping Search Engines API
              run: |
                  curl -X POST https://mybonzoaiblog.pages.dev/api/ping-search-engines || echo "API ping failed"

            - name: Log Results
              run: |
                  echo "✅ Auto-indexing completed at $(date)"
                  echo "🔍 Bing: Sitemap pinged"
                  echo "🔍 Google: Sitemap pinged"  
                  echo "🔍 IndexNow: URLs submitted"
                  echo "🤖 ChatGPT: Sitemap available"
