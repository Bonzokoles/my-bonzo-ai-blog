name: Clear Cloudflare Cache

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual cache purge'
        required: false
        default: 'Manual cache clear requested'

permissions:
  contents: read
  deployments: read

jobs:
  purge-cache:
    name: Purge Cloudflare Cache
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    
    steps:
      - name: Display Purge Information
        run: |
          echo "🔄 Cloudflare Cache Purge Initiated"
          echo "=================================="
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Trigger: Manual (workflow_dispatch)"
            echo "Reason: ${{ github.event.inputs.reason }}"
          else
            echo "Trigger: Automatic (deployment_status)"
            echo "Deployment Status: ${{ github.event.deployment_status.state }}"
            echo "Environment: ${{ github.event.deployment_status.environment }}"
          fi
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "=================================="

      - name: Purge Cloudflare Cache
        id: purge
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "🧹 Purging entire cache for zone..."
          
          # Validate required secrets are set
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "❌ ERROR: CLOUDFLARE_ZONE_ID secret is not set"
            echo "Please add it in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "❌ ERROR: CLOUDFLARE_API_TOKEN secret is not set"
            echo "Please add it in: Settings → Secrets and variables → Actions"
            exit 1
          fi
          
          # Call Cloudflare API to purge everything
          response=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            -w "\nHTTP_STATUS:%{http_code}")
          
          # Extract HTTP status code
          http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
          response_body=$(echo "$response" | sed '/HTTP_STATUS/d')
          
          echo "Response Code: $http_code"
          echo "Response Body: $response_body"
          
          # Check if the request was successful
          if [ "$http_code" == "200" ]; then
            # Parse success from JSON response
            success=$(echo "$response_body" | grep -o '"success":[^,}]*' | cut -d':' -f2)
            
            if [ "$success" == "true" ]; then
              echo "✅ SUCCESS: Cache purged successfully!"
              echo "purge_status=success" >> $GITHUB_OUTPUT
            else
              echo "⚠️ WARNING: API returned 200 but success was false"
              echo "Response: $response_body"
              echo "purge_status=partial" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "❌ ERROR: Cache purge failed with HTTP $http_code"
            echo "Response: $response_body"
            echo "purge_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Verify Cache Purge
        if: steps.purge.outputs.purge_status == 'success'
        run: |
          echo "✅ Cache Purge Verification"
          echo "=========================="
          echo "Status: Successfully completed"
          echo "Zone ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}"
          echo "Domain: www.mybonzoaiblog.com"
          echo "Action: Full cache purge (purge_everything)"
          echo "Result: All cached content has been cleared"
          echo "=========================="
          echo ""
          echo "ℹ️  Note: Changes should now be visible immediately to all users"
          echo "ℹ️  CDN will rebuild cache on next request to each URL"

      - name: Warm Up Critical Paths
        if: steps.purge.outputs.purge_status == 'success'
        run: |
          echo "🔥 Warming up critical paths after cache purge..."
          
          # Main domain URLs to warm up
          urls=(
            "https://www.mybonzoaiblog.com/"
            "https://www.mybonzoaiblog.com/blog"
            "https://mybonzoaiblog.pages.dev/"
            "https://mybonzoaiblog.pages.dev/blog"
          )
          
          for url in "${urls[@]}"; do
            echo "Warming: $url"
            curl -s -o /dev/null \
              --max-time 30 \
              --user-agent "GitHub-Actions-Cache-Warmer/1.0" \
              "$url" || echo "⚠️  Warning: Failed to warm $url"
            sleep 2
          done
          
          echo "✅ Cache warming completed"

      - name: Report Failure
        if: failure()
        run: |
          echo "❌ Cache Purge Failed"
          echo "===================="
          echo "Please check the following:"
          echo "1. CLOUDFLARE_ZONE_ID is correctly set in GitHub secrets"
          echo "2. CLOUDFLARE_API_TOKEN has proper permissions (Zone.Cache Purge)"
          echo "3. API token is still valid and not expired"
          echo "4. Cloudflare API is accessible and operational"
          echo ""
          echo "🔗 Useful links:"
          echo "  - GitHub Secrets: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo "  - Cloudflare API Tokens: https://dash.cloudflare.com/profile/api-tokens"
          echo "  - Cloudflare Status: https://www.cloudflarestatus.com/"
          echo "===================="
