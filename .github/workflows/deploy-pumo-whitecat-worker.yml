name: Deploy PUMO Whitecat Worker

on:
  push:
    branches: [main]
    paths:
      - "src/workers/pumo-whitecat/**"
      - ".github/workflows/deploy-pumo-whitecat-worker.yml"
  workflow_dispatch:

jobs:
  deploy_worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "src/workers/pumo-whitecat"
          command: deploy
