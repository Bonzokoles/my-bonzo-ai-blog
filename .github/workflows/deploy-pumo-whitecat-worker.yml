# This workflow deploys the PUMO Whitecat Worker to Cloudflare
# It also automatically sets the DASHBOARD_PASSWORD secret if configured in GitHub Secrets
# 
# Required GitHub Secrets:
# - CLOUDFLARE_API_TOKEN: Cloudflare API token with Workers edit permissions
# - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
# - DASHBOARD_PASSWORD: Password for worker dashboard (recommended: #HAOS77#)

name: Deploy PUMO Whitecat Worker

on:
  push:
    branches: [main]
    paths:
      - "src/workers/pumo-whitecat/**"
      - ".github/workflows/deploy-pumo-whitecat-worker.yml"
  workflow_dispatch:

jobs:
  deploy_worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "src/workers/pumo-whitecat"
          command: deploy

      - name: Set Dashboard Password Secret
        working-directory: "src/workers/pumo-whitecat"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          if [ -n "$DASHBOARD_PASSWORD" ]; then
            echo "Setting DASHBOARD_PASSWORD secret for jimbo-like-pumo-api worker..."
            echo "$DASHBOARD_PASSWORD" | npx wrangler secret put DASHBOARD_PASSWORD --name jimbo-like-pumo-api
            echo "✅ DASHBOARD_PASSWORD secret set successfully"
          else
            echo "⚠️ WARNING: DASHBOARD_PASSWORD GitHub secret is not set"
            echo "Dashboard will not be accessible until you set it in:"
            echo "Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: DASHBOARD_PASSWORD"
            echo "Value: #HAOS77#"
          fi
