name: Deploy AI SEO
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # Run every 6 hours for keep-alive

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'  # Cache npm for faster builds
        
    - name: Install
      run: npm ci
      
    - name: Build Astro
      run: npm run build
      
    # ✅ NEW: Verify Build Output
    - name: Verify Critical Files
      run: |
        echo "🔍 Verifying build output..."
        test -f dist/robots.txt || (echo "❌ robots.txt missing" && exit 1)
        test -f dist/sitemap-pumo.xml || (echo "❌ sitemap-pumo.xml missing" && exit 1)
        test -f dist/llms.txt || (echo "❌ llms.txt missing" && exit 1)
        test -f dist/8f9a2d4e6b1c3a5d7e9f0a2b4c6d8e0f.txt || (echo "❌ IndexNow key missing" && exit 1)
        test -d dist/.well-known || (echo "❌ .well-known directory missing" && exit 1)
        echo "✅ All critical files present"
        echo ""
        echo "📋 File details:"
        ls -lh dist/*.{txt,xml} 2>/dev/null || true

    - name: Deploy Pages (Keep Alive)
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npm run deploy:pages
    
    # ✅ NEW: Auto-Clear Cache After Deploy
    - name: Clear Cloudflare Cache
      env:
        CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      run: |
        echo "🧹 Clearing Cloudflare cache..."
        
        if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
          echo "⚠️ WARNING: CLOUDFLARE_ZONE_ID not set - skipping cache clear"
          echo "Add it in: Settings → Secrets and variables → Actions"
          exit 0
        fi
        
        response=$(curl -s -X POST \
          "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
          -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}' \
          -w "\nHTTP_STATUS:%{http_code}")
        
        http_code=$(echo "$response" | grep "HTTP_STATUS" | cut -d':' -f2)
        response_body=$(echo "$response" | sed '/HTTP_STATUS/d')
        
        echo "Response Code: $http_code"
        
        if [ "$http_code" == "200" ]; then
          echo "✅ Cache cleared successfully"
        else
          echo "⚠️ Cache clear may have failed (HTTP $http_code)"
          echo "Response: $response_body"
        fi
        
    # ✅ NEW: Verify Live URLs
    - name: Verify Live Deployment
      run: |
        echo "🔍 Verifying live URLs..."
        echo "Waiting 15 seconds for cache propagation..."
        sleep 15
        
        urls=(
          "https://mybonzoaiblog.pages.dev/robots.txt"
          "https://mybonzoaiblog.pages.dev/sitemap-pumo.xml"
          "https://mybonzoaiblog.pages.dev/llms.txt"
          "https://mybonzoaiblog.pages.dev/8f9a2d4e6b1c3a5d7e9f0a2b4c6d8e0f.txt"
        )
        
        failed=0
        for url in "${urls[@]}"; do
          echo "Testing: $url"
          status=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$url" || echo "000")
          if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
            echo "  ✅ $status OK"
          else
            echo "  ❌ $status FAILED"
            failed=1
          fi
        done
        
        if [ $failed -eq 1 ]; then
          echo "⚠️ Some URLs failed verification - check manually"
          echo "This may be due to DNS propagation delay"
          exit 1
        fi
        
        echo "✅ All URLs verified successfully"
        
    - name: Prefetch Critical Paths
      run: node scripts/prefetch.js || true

    - name: Health Check
      run: |
        curl -f https://mybonzoaiblog.pages.dev/api/health || echo "Health check warning"
