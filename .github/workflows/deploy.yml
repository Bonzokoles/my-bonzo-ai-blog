name: Deploy AI SEO
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # Run every 6 hours for keep-alive

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        
    - name: Install
      run: npm ci
      
    - name: Build Astro
      run: npm run build

    - name: Deploy Pages (Keep Alive)
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        npm run deploy:pages
        
    - name: Prefetch Critical Paths
      run: node scripts/prefetch.js

    - name: Health Check
      run: |
        curl -f https://mybonzoaiblog.com/api/health || echo "Health check warning"
