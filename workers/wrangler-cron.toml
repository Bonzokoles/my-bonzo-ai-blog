name = "pumo-sync-cron"
main = "workers/pumo-sync-cron.ts"
compatibility_date = "2024-10-28"
compatibility_flags = ["nodejs_compat"]

# Cron triggers - every day at 3:00 AM UTC
[triggers]
crons = ["0 3 * * *"]

# D1 Database binding - same as main app
[[d1_databases]]
binding = "PUMO_DB"
database_name = "pumo_products"  
database_id = "9534ef30-4ccd-4e90-9efc-7ddd2f9935cc"

# Environment variables
# Set these via wrangler secret put or Cloudflare Dashboard
[vars]
PUMO_API_BASE_URL = "https://api.meblepumo.pl/v1"

# Secrets to be set via wrangler secret put:
# wrangler secret put PUMO_API_KEY --env production
# PUMO_API_KEY = "your-api-key"