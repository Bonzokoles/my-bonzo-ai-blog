name = "auto-index-cron"
main = "workers/auto-index-cron.js"
compatibility_date = "2025-01-01"

# Cron trigger - co 30 minut
[triggers]
crons = ["*/30 * * * *"]

# Zmienne środowiskowe (opcjonalne)
[vars]
CRON_SECRET = "auto-index-2025"

# KV namespace dla logów (opcjonalne)
# [[kv_namespaces]]
# binding = "INDEX_LOG"
# id = "your_kv_namespace_id"
